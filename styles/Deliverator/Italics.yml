# typography.md: running prose stays upright. No decorative italics on titles,
# names or technical phrases; use wording and paragraph structure for emphasis.
# Bold and code are not emphasis, so they pass.
extends: existence
message: "Running prose stays upright. Remove the italics from '%s'."
