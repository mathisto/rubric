# Prose checks for the Rubric book. The rules are described in styles/README.md.
# Deliverator is the shared house style (pinned copy, see styles/Deliverator.PIN);
# Rubric adds the book's own rules and holds them to a stricter level.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Deliverator, Rubric

[*.md]
BasedOnStyles = Vale, Deliverator, Rubric

# The book speaks as "we": Matt and Claude, writing together. Never "I".
Deliverator.FirstPerson = error
Deliverator.Filler = error
Deliverator.Italics = error
# Rubric.Headings replaces it, with the book's own names.
Deliverator.Headings = NO
